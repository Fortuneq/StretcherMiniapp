<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Оплата — stretcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <section class="thanks">
    <div class="hero__logo">st</div>
    <h1 id="title">Проверяем оплату…</h1>
    <p id="sub">Обычно это занимает несколько секунд.</p>
    <a class="btn" id="cta" hidden>Активировать доступ в Telegram</a>
    <p class="legal" id="hint" hidden>Ссылка одноразовая: открой её с аккаунта,
    на котором будешь заниматься. Бот включит подписку автоматически.</p>
  </section>
</main>
<script>
const pid = localStorage.getItem('stretcher.lead.payment')
const title = document.getElementById('title')
const sub = document.getElementById('sub')
const cta = document.getElementById('cta')
const hint = document.getElementById('hint')
let tries = 0

async function poll() {
  if (!pid) {
    title.textContent = 'Не нашли платёж'
    sub.textContent = 'Похоже, страница открыта не после оплаты. Вернись на страницу подписки.'
    return
  }
  tries += 1
  try {
    const res = await fetch('/api/lead/status?payment_id=' + encodeURIComponent(pid))
    const data = await res.json()
    if (data.paid) {
      title.textContent = 'Оплата прошла!'
      sub.textContent = 'Остался один шаг — активируй доступ в Telegram:'
      cta.href = data.link
      cta.hidden = false
      hint.hidden = false
      localStorage.removeItem('stretcher.lead.payment')
      return
    }
  } catch { /* сеть моргнула — попробуем ещё */ }
  if (tries < 40) {
    setTimeout(poll, 3000)
  } else {
    title.textContent = 'Оплата пока не подтверждена'
    sub.textContent = 'Если деньги списались — обнови страницу через минуту, ссылка появится.'
  }
}
poll()
</script>
</body>
</html>
